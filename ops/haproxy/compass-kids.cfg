global
    log /dev/log local0
    log /dev/log local1 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend compass_kids_api
    bind 127.0.0.1:8081
    default_backend compass_kids_servers

backend compass_kids_servers
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 2s fall 3 rise 3

    server host_app 127.0.0.1:8080 check
    server docker_backup 172.22.0.4:8080 check backup
