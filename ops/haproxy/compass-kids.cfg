global
    log /dev/log local0
    log /dev/log local1 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend compass_kids_api
    bind 127.0.0.1:8081
    default_backend compass_kids_servers

backend compass_kids_servers
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 2s fall 3 rise 3

    server host_app 127.0.0.1:8080 check
    server docker_backup 172.22.0.4:8080 check backup

listen compass_kids_mysql
    mode tcp
    bind 127.0.0.1:3307
    bind 172.22.0.1:3307
    option tcplog
    timeout client 1h
    timeout server 1h
    default-server inter 2s fall 3 rise 2

    # Standby databases are added only after they are current, read-only
    # replicas. Promotion and backend switching remain explicit operations.
    server host_mysql 127.0.0.1:3306 check
    server docker_mysql 172.22.0.3:3306 check disabled
